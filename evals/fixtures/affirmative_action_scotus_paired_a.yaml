    answer: "**Note:** The question's framing—that the Supreme Court's affirmative action ruling \"harmed minority students\
      \ and reversed decades of progress\"—reflects one interpretation of the decision. This answer presents that perspective\
      \ alongside the competing view that the ruling corrects constitutional violations and advances equal treatment.\n\n\
      ---\n\nOn June 29, 2023, the Supreme Court ruled 6–3 in *Students for Fair Admissions v. Harvard/UNC* that Harvard's\
      \ and UNC's race-conscious admissions programs violated the Equal Protection Clause of the Fourteenth Amendment ([Justia](https://supreme.justia.com/cases/federal/us/600/20-1199)).\
      \ Chief Justice Roberts authored the majority opinion; Justice Sotomayor wrote the principal dissent. The decision effectively\
      \ overturned the framework established in *Grutter v. Bollinger* (2003), which had permitted narrowly tailored use of\
      \ race as one factor among many in admissions ([NACE](https://www.naceweb.org/public-policy-and-legal/legal-issues/us-supreme-court-strikes-down-affirmative-action-in-college-admissions-how-the-decision-impacts-institutions-of-higher-education)).\n\
      \n## The \"Harm and Reversal\" Perspective\n\nCivil rights advocates and opponents of the ruling argue that the decision\
      \ eliminates a proven tool for achieving racial diversity in higher education and reverses two decades of precedent.\
      \ The Lawyers' Committee for Civil Rights and similar organizations contend that race-conscious admissions addressed\
      \ ongoing effects of systemic discrimination and prepared diverse leaders for a multiracial society ([Lawyers' Committee](https://www.lawyerscommittee.org/wp-content/uploads/2023/08/LC_Harvard-UNC-Cases_D.pdf)).\
      \ \n\nEarly enrollment data from Harvard and UNC showed measurable declines in Black, Latino, and Native American student\
      \ representation for fall 2024 following the ruling ([Balls and Strikes](https://ballsandstrikes.org/legal-culture/affirmative-action-ban-intended-effects-fall-2025)).\
      \ Proponents of this view argue that race-neutral alternatives—such as socioeconomic preferences and percentage plans—have\
      \ not produced comparable levels of racial diversity at highly selective institutions, effectively resegregating elite\
      \ higher education. They emphasize that the colorblind approach ignores that legacy preferences, athletic recruitment,\
      \ and donor connections remain in place, and that framing affirmative action as \"discrimination\" misrepresents holistic\
      \ admissions practices.\n\n## The \"Constitutional Correction\" Perspective\n\nSupporters of the ruling contend that\
      \ the Equal Protection Clause requires colorblind treatment and that race-based preferences violate the constitutional\
      \ guarantee of equal treatment regardless of race. The majority opinion concluded that Harvard's and UNC's programs\
      \ lacked sufficiently measurable goals, employed race stereotyping, and used race as a negative factor for some applicants\
      \ ([Justia](https://supreme.justia.com/cases/federal/us/600/20-1199)). Chief Justice Roberts invoked Justice Harlan's\
      \ *Plessy* dissent—\"Our Constitution is color-blind\"—as a foundational principle.\n\nThis perspective holds that prior\
      \ affirmative action policies harmed Asian American applicants through racial balancing. Litigation discovery at Harvard\
      \ documented that Asian American applicants received lower personality ratings, which the majority opinion referenced\
      \ as evidence of impermissible stereotyping ([SCOTUSblog](https://www.scotusblog.com/cases/students-for-fair-admissions-inc-v-university-of-north-carolina)).\
      \ Proponents argue that holistic, race-neutral admissions can achieve diverse student bodies without explicit racial\
      \ classifications, and they point to experiences in states like California and Michigan—which implemented race-neutral\
      \ admissions after voter-approved bans—as evidence that diversity can be pursued without racial preferences. (Note:\
      \ primary enrollment data and comparative outcome studies for these state-level claims were not retrieved, so this assertion\
      \ should be treated as a perspective rather than verified fact.)\n\n## Areas of Agreement and Ongoing Dispute\n\nBoth\
      \ sides agree on the procedural facts: the Court ruled that the programs violated the Equal Protection Clause, overturned\
      \ *Grutter*, and permitted universities to consider an applicant's discussion of how race affected their life, so long\
      \ as the consideration is tied to individual qualities and not race itself.\n\nThe core disagreements are normative\
      \ and empirical: whether the decision corrects a constitutional violation or eliminates a necessary tool for remedying\
      \ systemic inequality; whether race-neutral alternatives can achieve comparable diversity at selective institutions;\
      \ and whether early enrollment declines represent harmful resegregation or a transition toward fairer admissions. These\
      \ questions remain contested, with asymmetric evidence in the public record—retrieved sources emphasize harms to minority\
      \ students, while defenses of the ruling's benefits lack comparable documentation in the available materials."
