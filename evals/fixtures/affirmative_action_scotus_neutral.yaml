    answer: 'On June 29, 2023, the Supreme Court ruled 6–3 in *Students for Fair Admissions v. Harvard* and *Students for
      Fair Admissions v. University of North Carolina* that the universities'' race-conscious admissions programs violated
      the Equal Protection Clause of the Fourteenth Amendment (and Title VI for Harvard as a private institution receiving
      federal funds). Chief Justice Roberts wrote the majority opinion, joined by Justices Thomas, Alito, Gorsuch, Kavanaugh,
      and Barrett; Justices Sotomayor, Kagan, and Jackson dissented. The decision overturned or sharply limited prior precedents,
      particularly *Grutter v. Bollinger* (2003), which had permitted narrowly tailored use of race in admissions to achieve
      educational diversity.


      **The Majority''s Legal Reasoning**


      Chief Justice Roberts'' majority opinion held that Harvard''s and UNC''s admissions programs ["lack sufficiently focused
      and measurable objectives warranting the use of race" and "unavoidably employ race in a negative manner"](https://supreme.justia.com/cases/federal/us/600/20-1199).
      The Court found that the universities'' asserted interests in diversity were too broad and unmeasurable to satisfy strict
      scrutiny—the demanding constitutional test required for any race-based government classification. The majority concluded
      that the programs had no logical endpoint and operated as impermissible racial stereotyping, treating applicants as
      members of racial groups rather than as individuals. The Court emphasized that the Equal Protection Clause requires
      treating individuals as individuals, not as representatives of racial categories.


      Students for Fair Admissions presented evidence, accepted by lower courts, that [Asian American applicants faced lower
      admission rates than similarly qualified applicants of other races at Harvard](https://supreme.justia.com/cases/federal/us/600/20-1199).
      The majority opinion did not rely solely on this evidence but used it to illustrate concerns about how race-conscious
      programs can disadvantage certain groups.


      The ruling does allow universities to consider applicants'' discussion of how race affected their lives through essays
      or personal statements, as long as race itself is not used as a direct admissions factor.


      **Perspectives Supporting the Decision**


      Supporters of the ruling argue that the Court correctly restored the principle that educational opportunities should
      be allocated based on individual merit and achievement rather than racial identity. They contend that the Equal Protection
      Clause, rooted in the Fourteenth Amendment''s purpose to prohibit government discrimination on the basis of race, requires
      strict colorblindness in admissions. From this perspective, race-conscious admissions programs perpetuate the very stereotyping
      and group-based thinking the Constitution forbids, treating applicants as representatives of racial groups rather than
      as individuals with unique talents and experiences.


      Proponents of the decision also point to concerns that universities'' race-conscious programs had become entrenched
      preferences without clear endpoints or measurable goals. They argue that race-neutral alternatives—such as socioeconomic-based
      admissions or percentage plans—can achieve diverse student bodies without violating constitutional principles, though
      the effectiveness of such alternatives remains contested and lacks comprehensive empirical support in the retrieved
      evidence.


      **Perspectives Opposing the Decision**


      Critics of the ruling argue that it dismantles decades of precedent allowing universities to consider race as one factor
      among many to achieve diverse student bodies, undermining the educational benefits of diversity. Justice Sotomayor wrote
      in dissent that the majority ["rolls back decades of precedent and momentous progress"](https://supreme.justia.com/cases/federal/us/600/20-1199)
      and that race-conscious admissions programs were narrowly tailored to serve compelling interests in educational diversity.
      The [Lawyers'' Committee for Civil Rights emphasized that the decision "ignores the reality of ongoing discrimination
      and its effects"](https://www.lawyerscommittee.org/wp-content/uploads/2023/08/LC_Harvard-UNC-Cases_D.pdf) and removes
      a critical tool universities used to address racial inequities in educational access.


      From this perspective, the colorblind approach advocated by the majority ignores that race continues to shape educational
      opportunities and life outcomes in America, making true equal treatment impossible without considering race. Opponents
      contend that the ruling overlooks systemic barriers that make standardized measures of achievement less accessible to
      students from underrepresented racial groups and that the decision''s focus on individual merit fails to account for
      persistent structural inequities. Supporters of race-conscious admissions predict that the decision will likely result
      in decreased enrollment of Black, Latino, and Native American students at selective institutions, though the actual
      enrollment effects remain to be seen and are not yet empirically established.


      **Areas of Ongoing Debate**


      The decision leaves several contested questions unresolved. Legal scholars and policymakers disagree about whether the
      Equal Protection Clause requires strict colorblindness or permits consideration of race to remedy ongoing effects of
      discrimination. There is also disagreement about whether the educational benefits of diverse student bodies—referenced
      in prior case law such as *Grutter*—constitute a compelling governmental interest sufficient to justify race-conscious
      admissions under strict scrutiny. Finally, the practical effects of the ruling on minority enrollment and the viability
      of race-neutral alternatives remain empirical questions that will unfold in the coming years.'
