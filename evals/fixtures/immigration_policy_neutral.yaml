  complete_payload:
    in_scope: true
    answer: 'The debate over US immigration policy centers on two competing frameworks that reflect fundamentally different
      priorities and diagnoses of the system''s problems.


      **Note:** No primary government sources—such as legislative text, executive orders, official fiscal data, or court opinions—were
      retrieved for this answer. Empirical claims about economic and fiscal impacts rest on secondary think tank analyses
      rather than official records, and should be treated accordingly.


      ## Areas of Agreement


      Both sides acknowledge that the US immigration system has experienced decades of legislative gridlock, with the last
      major comprehensive reform enacted in 1986. The current system leaves millions of long-resident unauthorized immigrants
      in legal limbo without clear status. Both perspectives agree that immigration policy involves tradeoffs among border
      security, economic needs, humanitarian concerns, and rule of law, though they weigh these priorities very differently.


      ## The Enforcement-and-Restriction-First Perspective


      Proponents of this view argue that the current immigration system lacks adequate enforcement, leading to unauthorized
      entries and overstays that undermine rule of law and border sovereignty. They contend that border security and interior
      enforcement must be strengthened *before* any legalization or expansion of legal immigration pathways can be considered.


      This perspective emphasizes two core concerns. First, advocates argue that comprehensive reform proposals rewarding
      unauthorized entry with legalization pathways create incentives for future unauthorized migration, making enforcement
      harder. They point to the 1986 Immigration Reform and Control Act, where legalization occurred but—in their view—enforcement
      provisions were never fully implemented, and unauthorized immigration continued. Second, restrictionist research organizations
      such as the Center for Immigration Studies assert that mass immigration imposes fiscal costs on state and local governments
      through public services, education, and healthcare expenditures that exceed tax contributions from unauthorized immigrants.


      Policy proposals aligned with this framework, such as those in [Project 2025](https://www.americanimmigrationcouncil.org/blog/what-project-2025-says-about-immigration),
      call for increased deportations, ending the Flores settlement (which limits detention of migrant children), and expanded
      detention capacity. Proponents see enforcement-first approaches as necessary to restore the integrity of immigration
      law and address fiscal burdens on communities and labor market effects on lower-wage American workers.


      ## The Comprehensive-Reform-with-Legalization Perspective


      Advocates of comprehensive reform argue that the immigration system is broken due to legislative gridlock, leaving millions
      in legal limbo and creating a large unauthorized population that cannot be realistically deported. They contend that
      effective reform requires *simultaneously* combining border security improvements with legalization pathways for long-resident
      unauthorized immigrants and expanded legal immigration channels to match labor market needs and family reunification
      goals.


      This perspective emphasizes that enforcement-only approaches are inhumane, economically disruptive, and logistically
      infeasible. Proponents argue that mass deportation would separate families and harm industries dependent on immigrant
      labor. Pro-immigration research organizations such as the [Migration Policy Institute](https://www.migrationpolicy.org/programs/us-immigration-policy-program)
      and the [American Immigration Council](https://www.americanimmigrationcouncil.org/blog/what-project-2025-says-about-immigration)
      assert that immigrants contribute economically through labor force participation, entrepreneurship, tax payments, and
      consumer spending, and that legalization would increase those contributions.


      Advocates cite the bipartisan [2013 Senate immigration bill (S.744)](https://www.migrationpolicy.org/topics/comprehensive-immigration-reform)
      as a model combining enforcement, legalization, and visa expansion. They view restriction-focused policies as scapegoating
      immigrants for broader economic anxieties and ignoring immigrants'' positive fiscal and economic contributions. This
      perspective sees enforcement-first approaches as perpetuating a permanent underclass and violating human rights through
      family separation.


      ## The Core Empirical Dispute


      The two frameworks rest on sharply different empirical claims about fiscal and economic impacts. Restrictionist organizations
      assert that unauthorized immigrants impose net fiscal costs; pro-immigration organizations assert that immigrants generate
      net economic benefits. **These competing claims are not resolved in the available evidence.** The retrieved sources
      consist of secondary analyses from think tanks with differing perspectives, not primary government fiscal data or peer-reviewed
      academic studies. Specific figures for fiscal costs, economic contributions, crime rates, wage impacts, and tax totals
      were not verified through official government sources in this search.


      ## Policy Sequencing and Strategy


      A fundamental disagreement concerns whether enforcement and border security must be achieved *before* legalization (the
      enforcement-first view) or whether these must be addressed *simultaneously* in comprehensive legislation (the reform-with-legalization
      view). Enforcement-first advocates see comprehensive proposals as politically unworkable and as repeating past failures.
      Comprehensive-reform advocates see enforcement-only approaches as ignoring economic realities and perpetuating human
      rights violations.


      Both perspectives reflect deeply held values: the enforcement-first framework prioritizes rule of law, sovereignty,
      and fiscal responsibility; the comprehensive-reform framework prioritizes pragmatism, economic dynamism, and humanitarian
      protection.'
