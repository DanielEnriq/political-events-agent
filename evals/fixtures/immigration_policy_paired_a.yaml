    answer: 'The characterization of Biden administration policies as "open-border" is a contested framing. Congressional
      Republicans, including the [House Oversight Committee](https://oversight.house.gov/release/wrap-up-biden-administrations-policies-have-fueled-worst-border-crisis-in-u-s-history%EF%BF%BC),
      describe the administration''s approach as having "fueled the worst border crisis in U.S. history," pointing to policy
      reversals in early 2021—including ending the Remain in Mexico program, halting border wall construction, and narrowing
      interior enforcement priorities—as factors that weakened deterrence and encouraged increased migration. Proponents of
      this view argue that the administration prioritized processing and release over detention and removal, creating incentives
      for unlawful crossings, and that encounters reportedly reached record levels in FY2023.


      However, official government sources document a different policy trajectory. In June 2024, the administration issued
      [executive actions](https://cr.usembassy.gov/fact-sheet-president-biden-announces-new-actions-secure-border) that bar
      asylum for migrants crossing unlawfully when daily encounters exceed 2,500, with automatic restrictions triggered at
      a seven-day average of 2,500—measures that contradict the "open-border" characterization. The [Migration Policy Institute
      reports](https://www.migrationpolicy.org/news/fy2024-us-border-encounters-plunge) that border encounters "plunged" in
      FY2024 following these policy adjustments, enforcement cooperation with Mexico, and regional diplomacy. Analysis from
      the [National Immigration Forum](https://forumtogether.org/article/qa-the-biden-border-proclamation) and [BBC](https://www.bbc.com/news/world-us-canada-65574725)
      describes the 2024 proclamation as restrictive, limiting asylum access and increasing consequences for unlawful entry.


      Supporters of the administration''s approach argue that it maintained enforcement while updating policies to align with
      asylum law and humanitarian standards, and that the "open-border" label misrepresents an approach that combined lawful
      pathways with consequences for unlawful entry. They contend that early-term policy changes replaced legally vulnerable
      or operationally ineffective Trump-era measures with sustainable enforcement, and that the FY2024 decline demonstrates
      effective adaptation to changing conditions.


      **Key areas of disagreement include:**


      - **Policy characterization:** Whether the administration''s approach constitutes "open borders" or enforcement with
      different priorities and humanitarian considerations.

      - **Causation:** Whether early policy changes caused encounter increases, or whether those changes responded to legal,
      operational, and humanitarian concerns while encounters were driven by broader push-pull factors.

      - **Crisis framing:** Whether encounter levels during 2021-2023 represent a "crisis" requiring emergency measures or
      manageable fluctuation in migration patterns.

      - **The 2024 shift:** Whether the asylum restrictions demonstrate genuine enforcement commitment or election-year political
      repositioning.


      Both perspectives agree that encounter levels fluctuated significantly, with periods of high crossings followed by sharp
      declines in FY2024, and that the administration''s 2024 executive actions imposed substantial asylum restrictions. The
      interpretive disagreement centers on whether the overall policy trajectory reflects inadequate enforcement that invited
      a crisis, or adaptive management balancing enforcement with legal and humanitarian obligations.'
