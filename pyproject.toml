[project]
name = "political-events-agent"
version = "0.1.0"
description = "Agentic political-events AI chatbot — Civic Revere candidacy project (Day 1 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "gradio>=4.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
# Day 1 hello-world (single-stage smoke test).
revere-hello = "revere_agent.cli.hello:main"
# Day 2 reasoning pipeline (S1→S7 + trace).
revere-run = "revere_agent.cli.run:main"
# Day 4 Gradio UI.
revere-ui = "revere_agent.ui.gradio_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revere_agent"]
