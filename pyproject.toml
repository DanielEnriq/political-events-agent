[project]
name = "political-events-agent"
version = "0.1.0"
description = "Agentic political-events AI chatbot — Civic Revere candidacy project (Day 1 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
# Convenience entry point. After `uv sync`, run: `uv run revere-hello`
revere-hello = "revere_agent.cli.hello:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revere_agent"]
